name: build

# Verification build: has to be startable by hand, and has to prove the exporter regression tests pass.
# Branch pushes and tags are already built by the "release" workflow, so this one does not duplicate them.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build-windows
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install 26100 SDK and WDK
        run: |
          winget install --source winget --exact --id Microsoft.WindowsSDK.10.0.26100 --disable-interactivity --accept-source-agreements
          winget install --source winget --exact --id Microsoft.WindowsWDK.10.0.26100 --disable-interactivity --accept-source-agreements
          echo "WindowsTargetPlatformVersion=10.0.26100.0" >> $Env:GITHUB_ENV

      # The MSVC STL on the runner image rejects the LLVM it ships with (STL1000, wants Clang 22+), which kills the
      # very first C++ target. build_all.ps1 takes CC/CXX/RC from whatever `clang` resolves to, so PATH decides.
      - name: Select a Clang that matches the MSVC STL
        shell: pwsh
        run: ./.github/scripts/select-clang.ps1

      - name: Figure out the version
        id: checktag
        run: |
          cd ${{ github.workspace }}
          # Tag builds take the version from the tag, everything else from the closest tag plus the commit distance
          If ($Env:GITHUB_REF -match "refs/tags/(.+)$") {
              $Version = $Matches[1];
          } Else {
              $Version = (git describe --dirty --broken --always 2>$null);
          }
          If ($Version -match "v?([0-9]+)\.([0-9]+)\.([0-9]+)") {
              $VersionMajor = $Matches[1];
              $VersionMinor = $Matches[2];
              $VersionPatch = $Matches[3];
          } Else {
              # Nothing to derive a version from, and an installer without one is worse than a date based one
              $Version = (Get-Date -Format "yyyy.MM.dd");
              Write-Host "::warning::No version tag reachable, using the date as the version: $Version";
              $VersionMajor, $VersionMinor, $VersionPatch = $Version -split '\.';
          }
          Echo ("version=" + $Version) >> $Env:GITHUB_OUTPUT;
          Echo ("version_major=" + $VersionMajor) >> $Env:GITHUB_OUTPUT;
          Echo ("version_minor=" + $VersionMinor) >> $Env:GITHUB_OUTPUT;
          Echo ("version_patch=" + $VersionPatch) >> $Env:GITHUB_OUTPUT;
          # build_all.ps1 takes the version from the environment; without these the installer ends up as 0.0.0
          Echo ("CI_VERSION=" + $Version) >> $Env:GITHUB_ENV;
          Echo ("CI_VERSION_MAJOR=" + $VersionMajor) >> $Env:GITHUB_ENV;
          Echo ("CI_VERSION_MINOR=" + $VersionMinor) >> $Env:GITHUB_ENV;
          Echo ("CI_VERSION_PATCH=" + $VersionPatch) >> $Env:GITHUB_ENV;

      - name: Build all
        run: |
          cd ${{ github.workspace }}
          .\build_all.ps1

      # Covers the export / clipboard timestamp regression. Exits non-zero on failure, which fails the job.
      - name: Run regression tests
        shell: pwsh
        run: |
          ctest --test-dir build/oht-x64 --output-on-failure 2>&1 | Tee-Object -FilePath build/oht-x64/ctest.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-log
          path: .\build\oht-x64\ctest.log
          if-no-files-found: warn

      - name: Upload unpacked
        uses: actions/upload-artifact@v5
        with:
          name: unpacked
          path: |
            .\build\oht-*\*.dll
            .\build\oht-*\*.exe
            .\build\oht-*\*.pdb

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: installers
          path: |
            .\install\*.msi

      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          @(
            '### build ${{ steps.checktag.outputs.version }}',
            '',
            '| artifact | contents |',
            '| --- | --- |',
            '| `unpacked` | OpenHashTab32/64/ARM64 dll, StandaloneStub.exe, Benchmark.exe, pdbs |',
            '| `installers` | msi installers |',
            '| `test-log` | ctest output of the regression tests |',
            '',
            'Download them from the run page, build_all.ps1 also leaves the binaries in build\oht-*.'
          ) >> $env:GITHUB_STEP_SUMMARY
